[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lh-rf-fingerprinter"
version = "0.1.0"
description = "Production-grade, zero-dependency Python 3.11+ Physical-Layer RF Transmitter Fingerprinting Engine, IQ Imbalance / CFO / Phase Noise Feature Extractor, Mahalanobis Device Classifier, and 10-Rule RF Physical-Layer Security Posture Auditor"
readme = "README.md"
authors = [
    { name = "Sameer Tawade", email = "ops@logihertz.com" }
]
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
dependencies = []
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Telecommunications Industry",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Communications :: Ham Radio",
]

[project.urls]
Homepage = "https://github.com/Logihertz-Systems-OPC-Pvt-Ltd/lh-rf-fingerprinter"
Documentation = "https://github.com/Logihertz-Systems-OPC-Pvt-Ltd/lh-rf-fingerprinter#readme"
Repository = "https://github.com/Logihertz-Systems-OPC-Pvt-Ltd/lh-rf-fingerprinter"
Issues = "https://github.com/Logihertz-Systems-OPC-Pvt-Ltd/lh-rf-fingerprinter/issues"

[project.scripts]
lh-rf-fingerprint = "lh_rf_fingerprinter.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
